name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, ejecutar tests y empaquetar
        run: ./mvnw -B verify

      - name: Publicar JAR ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: sistema-actas
          path: target/sistema-actas.jar

  schema-mysql:
    name: Validar esquema en MySQL 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL con los scripts de db/
        run: docker compose up -d --wait
      - name: Verificar datos de demostración
        run: |
          docker exec actas-mysql mysql -uactas -pactas actas -e \
            "SELECT COUNT(*) AS miembros FROM miembros; SELECT COUNT(*) AS reuniones FROM reuniones;"
